[project]
authors = [{name = "Ivana", email = "ivana.gyro@gmail.com"}]
dependencies = ["fonttools>=4.64.0,<5", "requests>=2.34.2,<3", "pillow>=12.3.0,<13", "matplotlib>=3.11.1,<4", "freetype-py>=2.5.1,<3", "pytest>=9.1.1,<10"]
name = "nimbus-match"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "win-arm64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
nimbus_match = { path = ".", editable = true }

[tool.pixi.tasks]
