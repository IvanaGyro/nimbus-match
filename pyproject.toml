[project]
name = "nimbus-match"
version = "0.1.0"
authors = [ { name = "Ivana", email = "ivana.gyro@gmail.com" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fonttools>=4.64,<5",
  "freetype-py>=2.5.1,<3",
  "matplotlib>=3.11.1,<4",
  "pillow>=12.3,<13",
  "requests>=2.34.2,<3",
]

optional-dependencies.dev = [
  "pre-commit>=4.6.2,<5",
  "pyproject-fmt>=2.29.3,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.6,<0.17",
]

[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "osx-arm64", "win-64", "win-arm64" ]

[tool.pixi.environments]
default = [ "dev" ]
