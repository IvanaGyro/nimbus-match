name: Weekly Independent Font Releases
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build unchanged families as development artifacts (never publish them)
        type: boolean
        default: false
      family:
        description: Check upstream changes for the selected family or both
        type: choice
        options: [all, nimbus-match, termes-match]
        default: all
concurrency:
  group: font-match-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      families: ${{ steps.prepare.outputs.families }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.73.0
      - id: prepare
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_FAMILY: ${{ inputs.family || 'all' }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          $arguments = @('prepare', '--family', $env:SELECTED_FAMILY)
          if ($env:FORCE_BUILD -eq 'true') { $arguments += '--force' }
          pixi run python -m font_match.release @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.should_build == 'true'
        with:
          name: resolved-inputs
          path: |
            build_temp/inputs.json
            build_temp/*-inputs.json
            build_temp/archives/*.zip
          if-no-files-found: error
  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.prepare.outputs.families) }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.73.0
      - uses: actions/download-artifact@v4
        with:
          name: resolved-inputs
          path: build_temp
      - run: pixi run font-match build --family ${{ matrix.family }} --inputs build_temp/${{ matrix.family }}-inputs.json
      - run: pixi run pytest --junitxml=build_temp/tests.xml
        env:
          FONT_MATCH_FAMILY: ${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.family }}
          path: build_temp/tests.xml
          if-no-files-found: ignore
      - run: pixi run font-match verify --family ${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: fonts-${{ matrix.family }}
          path: dist/${{ matrix.family }}/
          if-no-files-found: error
  publish:
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.prepare.outputs.families) }}
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.73.0
      - uses: actions/download-artifact@v4
        with:
          name: resolved-inputs
          path: build_temp
      - uses: actions/download-artifact@v4
        with:
          name: fonts-${{ matrix.family }}
          path: dist/${{ matrix.family }}
      - run: pixi run python -m font_match.release publish --family ${{ matrix.family }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
